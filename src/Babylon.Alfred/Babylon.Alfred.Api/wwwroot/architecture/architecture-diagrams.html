<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>babylon-api — Living Architecture Doc</title>
<style>
  :root {
    --bg: #0b0e14;
    --bg-alt: #11151f;
    --panel: #161b26;
    --border: #262d3d;
    --text: #d7dce5;
    --text-dim: #8891a3;
    --accent: #5ec7ff;
    --accent-glow: rgba(94, 199, 255, 0.35);
    --planned: #f0b429;
    --unwired: #8891a3;
    --danger: #ff6b6b;
    --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  *::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
  body {
    background: linear-gradient(120deg, #0b0e14, #0d1420, #0b0e14, #10131c);
    background-size: 400% 400%;
    animation: bgshift 45s ease infinite;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  @keyframes bgshift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 20px;
  }
  header h1 { font-size: 18px; margin: 0; font-family: var(--mono); }
  header .sub { color: var(--text-dim); font-size: 13px; }
  nav { display: flex; gap: 8px; padding: 14px 28px; border-bottom: 1px solid var(--border); }
  nav button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  nav button.active { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
  main { padding: 28px; }
  #view-components { max-width: 1400px; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }
  .node {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
    transition: box-shadow .2s, border-color .2s;
    overflow-wrap: anywhere;
  }
  .node:hover, .node.highlight, .node.related-expanded, .node.pin-related-expanded { border-color: var(--accent); box-shadow: 0 0 14px var(--accent-glow); }
  .node.dim { opacity: 0.25; }
  .node.status-planned { border-color: var(--planned); color: var(--planned); border-style: dashed; }
  .node.status-unwired { color: var(--unwired); border-style: dotted; }
  .badge { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 2px 6px; border-radius: 3px; margin-left: 6px; }
  .badge.planned { background: rgba(240,180,41,.15); color: var(--planned); }
  .badge.unwired { background: rgba(136,145,163,.15); color: var(--unwired); }
  svg.edges { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  path.edge { fill: none; stroke: var(--border); stroke-width: 1.5; }
  path.edge.flow { stroke: var(--accent); stroke-dasharray: 6 4; animation: flow 0.6s linear; }
  @keyframes flow { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }
  .rel-container { position: relative; }
  .layer-band { border-top: 1px solid var(--border); padding: 18px 0; }
  .layer-band:first-child { border-top: none; }
  .layer-label { font-family: var(--mono); font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
  .layer-lanes { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); column-gap: 36px; }
  .feature-lane { border: 1px solid var(--border); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .feature-lane-nodes { display: flex; flex-wrap: wrap; gap: 6px; }
  .feature-lane-nodes .node { flex: 1 1 100%; font-size: 11px; padding: 6px 8px; white-space: nowrap; }
  .feature-lane-label { font-family: var(--mono); font-size: 10px; color: var(--text-dim); margin-bottom: 2px; }
  .feature-lane[data-feature="Authentication"] .node { border-left: 3px solid #5ec7ff; }
  .feature-lane[data-feature="BrokerIntegration"] .node { border-left: 3px solid #f0b429; }
  .feature-lane[data-feature="Investments"] .node { border-left: 3px solid #6ee7b7; }
  .feature-lane[data-feature="Startup"] .node { border-left: 3px solid #f472b6; }
  #components-diagram { position: relative; }
  .node.db-table { transition: box-shadow .2s, border-color .2s; }
  .io-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .io-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  .io-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .io-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .io-tab { background: transparent; border: 1px solid transparent; color: var(--text-dim); font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 4px; cursor: pointer; }
  .io-tab.status-2xx { color: #6ee7b7; }
  .io-tab.status-4xx, .io-tab.status-5xx { color: var(--danger); }
  .io-tab.active { border-color: currentColor; background: rgba(255,255,255,.06); }
  .io-copy-btn { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 12px; padding: 2px 6px; line-height: 1; flex-shrink: 0; }
  .io-copy-btn:hover { color: var(--accent); }
  .io-copy-btn.copied { color: #6ee7b7; }
  .io-body { padding: 12px; margin: 0; font-family: var(--mono); font-size: 10.5px; white-space: pre-wrap; word-break: break-word; max-height: 280px; overflow-y: auto; }
  #dbschema-detail {
    position: fixed; top: 140px; right: 24px; width: 320px; max-height: 70vh;
    overflow-y: auto; background: var(--panel); border: 1px solid var(--accent);
    border-radius: 8px; box-shadow: 0 14px 32px rgba(0,0,0,.55); padding: 16px;
    z-index: 50; display: none;
  }
  #dbschema-detail.visible { display: block; }
  .node.db-table.pinned-expanded { border-color: var(--accent); box-shadow: 0 0 14px var(--accent-glow); outline: 1px solid var(--accent); outline-offset: -2px; }
  #dbschema-detail .detail-title { font-family: var(--mono); font-size: 14px; color: var(--accent); margin-bottom: 10px; }
  .db-table-header { display: flex; align-items: center; gap: 6px; }
  .db-table-hint { font-size: 9px; color: var(--text-dim); font-style: italic; }
</style>
</head>

<header>
  <h1>babylon-api</h1>

<script>
const API_DATA = JSON.parse(document.getElementById('api-data').textContent);

const DB_COLUMNS = [
  ['user', 'portfolio-snapshot', 'refresh-token', 'cash-balance'],
  ['transaction', 'allocation-strategy', 'recurring-schedule'],
  ['security', 'market-price']
];

function showView(name) {
  document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + name));
  document.querySelectorAll('nav button').forEach(el => el.classList.toggle('active', el.dataset.view === name));
  if (name === 'dbschema' && typeof drawDbSchemaEdges === 'function') drawDbSchemaEdges();
  if (name === 'components' && typeof drawComponentEdges === 'function') drawComponentEdges();
}
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => showView(btn.dataset.view));
});

function renderComponents() {
  const container = document.getElementById('view-components');
  const layerOrder = ['Controller', 'Service', 'Utility', 'Repository', 'External'];
  const featureOrder = ['Authentication', 'BrokerIntegration', 'Investments', 'Startup'];
  const byLayer = {};
  layerOrder.forEach(l => byLayer[l] = []);
  API_DATA.components.forEach(c => {
    if (c.id === 'db-context') return;
    if (byLayer[c.layer]) byLayer[c.layer].push(c);
  });

  let html = '<div id="components-diagram">';
  layerOrder.forEach(layer => {
    const nodes = byLayer[layer];
    if (!nodes.length) return;
    html += `<div class="layer-band" data-layer="${layer}"><div class="layer-label">${layer}</div><div class="layer-lanes">`;
    featureOrder.forEach(feature => {
      const featureNodes = nodes.filter(c => c.feature === feature);
      const laneStyle = featureNodes.length ? '' : ' style="border:none;padding:0;"';
      html += `<div class="feature-lane" data-feature="${feature}"${laneStyle}>`;
      if (featureNodes.length) {
        html += `<div class="feature-lane-label">${feature}</div><div class="feature-lane-nodes">`;
        featureNodes.forEach(c => {
          const statusClass = c.status ? ` status-${c.status}` : '';
          const badge = c.status ? `<span class="badge ${c.status}">${c.status}</span>` : '';
          html += `<div class="node${statusClass}" id="node-${c.id}" data-id="${c.id}">${c.name}${badge}</div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    });
    html += `</div></div>`;
  });
  html += `<div class="layer-band" data-layer="DbContext" style="text-align:center;">
    <div class="layer-label">Data</div>
    <div class="node" id="node-db-context" data-id="db-context" style="display:inline-block;">BabylonDbContext</div>
  </div>`;
  html += `<svg class="edges" id="edges-components"></svg>`;
  html += '</div>';
  container.innerHTML = html;

  drawComponentEdges();
  attachComponentInteractions();
  window.addEventListener('resize', drawComponentEdges);
}

function drawComponentEdges() {
  const svg = document.getElementById('edges-components');
  if (!svg) return;
  svg.innerHTML = '';
  const svgRect = svg.getBoundingClientRect();
  const pairs = new Map();
  API_DATA.components.forEach(c => {
    c.connectsTo.forEach(targetId => {
      const target = API_DATA.components.find(t => t.id === targetId);
      if (!target) return;
      const isDb = targetId === 'db-context';
      const fromKey = `${c.feature}|${c.layer}`;
      const toKey = isDb ? 'db-context' : `${target.feature}|${target.layer}`;
      if (fromKey === toKey) return;
      const pairKey = fromKey + '=>' + toKey;
      if (!pairs.has(pairKey)) pairs.set(pairKey, { fromKey, toKey, isDb, members: new Set() });
      const entry = pairs.get(pairKey);
      entry.members.add(c.id);
      entry.members.add(targetId);
    });
  });
  const gutterEdgeCounts = {};
  pairs.forEach(({ fromKey, toKey, isDb, members }) => {
    const [fromFeature, fromLayer] = fromKey.split('|');
    const fromBandEl = document.querySelector(`.layer-band[data-layer="${fromLayer}"]`);
    if (!fromBandEl) return;
    const fromEl = fromBandEl.querySelector(`.feature-lane[data-feature="${fromFeature}"]`);
    if (!fromEl) return;
    let toEl;
    if (isDb) {
      toEl = document.getElementById('node-db-context');
    } else {
      const [toFeature, toLayer] = toKey.split('|');
      const toBandEl = document.querySelector(`.layer-band[data-layer="${toLayer}"]`);
      toEl = toBandEl ? toBandEl.querySelector(`.feature-lane[data-feature="${toFeature}"]`) : null;
    }
    if (!toEl) return;
    const a = fromEl.getBoundingClientRect();
    const b = toEl.getBoundingClientRect();
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    let d;
    if (isDb) {
      const columnKey = Math.round(a.right);
      gutterEdgeCounts[columnKey] = (gutterEdgeCounts[columnKey] || 0) + 1;
      const idx = gutterEdgeCounts[columnKey] - 1;
      const gapX = a.right - svgRect.left + 8 + (idx % 4) * 8;
      const y1 = a.top + a.height / 2 - svgRect.top;
      const dataBand = toEl.closest('.layer-band');
      const gutterY = dataBand.getBoundingClientRect().top - svgRect.top - 9;
      const x2 = b.left + b.width / 2 - svgRect.left;
      const y2 = b.top - svgRect.top;
      d = `M ${a.right - svgRect.left} ${y1} L ${gapX} ${y1} L ${gapX} ${gutterY} L ${x2} ${gutterY} L ${x2} ${y2}`;
    } else {
      const columnKey = Math.round(Math.max(a.right, b.right));
      gutterEdgeCounts[columnKey] = (gutterEdgeCounts[columnKey] || 0) + 1;
      const idx = gutterEdgeCounts[columnKey] - 1;
      const gapX = Math.max(a.right, b.right) - svgRect.left + 8 + (idx % 4) * 8;
      const y1 = a.top + a.height / 2 - svgRect.top;
      const y2 = b.top + b.height / 2 - svgRect.top;
      d = `M ${a.right - svgRect.left} ${y1} L ${gapX} ${y1} L ${gapX} ${y2} L ${b.right - svgRect.left} ${y2}`;
    }
    path.setAttribute('d', d);
    path.setAttribute('class', 'edge');
    path.dataset.from = fromKey;
    path.dataset.to = toKey;
    path.dataset.members = Array.from(members).join(',');
    svg.appendChild(path);
  });
  if (typeof pinnedComponentId !== 'undefined' && pinnedComponentId) highlightComponent(pinnedComponentId, true);
}

let pinnedComponentId = null;

function attachComponentInteractions() {
  document.querySelectorAll('#view-components .node').forEach(node => {
    node.addEventListener('mouseenter', () => {
      if (!pinnedComponentId) highlightComponent(node.dataset.id, false);
    });
    node.addEventListener('mouseleave', () => {
      if (!pinnedComponentId) clearComponentHighlight();
    });
    node.addEventListener('click', () => {
      if (pinnedComponentId === node.dataset.id) {
        pinnedComponentId = null;
        clearComponentHighlight();
      } else {
        pinnedComponentId = node.dataset.id;
        highlightComponent(pinnedComponentId, true);
      }
    });
  });
}

function highlightComponent(id, dimOthers) {
  const related = new Set([id]);
  API_DATA.components.forEach(c => {
    if (c.id === id) c.connectsTo.forEach(t => related.add(t));
    if (c.connectsTo.includes(id)) related.add(c.id);
  });
  document.querySelectorAll('#view-components .node').forEach(n => {
    n.classList.toggle('highlight', related.has(n.dataset.id));
    n.classList.toggle('dim', dimOthers && !related.has(n.dataset.id));
  });
  document.querySelectorAll('#view-components path.edge').forEach(p => {
    const members = (p.dataset.members || '').split(',');
    p.classList.toggle('flow', members.some(m => related.has(m)));
  });
}

function clearComponentHighlight() {
  document.querySelectorAll('#view-components .node').forEach(n => n.classList.remove('highlight', 'dim'));
  document.querySelectorAll('#view-components path.edge').forEach(p => p.classList.remove('flow'));
}

renderComponents();

function renderDbSchema() {
  const container = document.getElementById('view-dbschema');
  const tableById = {};
  API_DATA.dbSchema.tables.forEach(t => { tableById[t.id] = t; });
  const dbTableDetailHtml = t => {
    let bodyHtml = `<div class="detail-title">${t.name} <span style="color:var(--text-dim);font-size:10px;">(${t.tableName})</span></div>`;
    t.columns.forEach(c => {
      const pk = c.pk ? ' 🔑' : '';
      const fk = c.fk ? ' 🔗' : '';
      const warn = c.noIndex ? ` <span class="badge" style="background:rgba(255,107,107,.15);color:var(--danger);">no index</span>` : '';
      bodyHtml += `<div style="font-family:var(--mono);font-size:11px;color:var(--text);padding:2px 0;border-bottom:1px solid var(--border);">${c.name}${pk}${fk}: <span style="color:var(--text-dim);">${c.type}${c.nullable ? '?' : ''}</span>${warn}</div>`;
    });
    if (t.indexes.length) {
      bodyHtml += `<div style="margin-top:6px;font-size:10px;color:var(--text-dim);">`;
      t.indexes.forEach(ix => {
        bodyHtml += `idx(${ix.columns.join(',')})${ix.unique ? ' unique' : ''}${ix.filter ? ' where ' + ix.filter : ''}<br>`;
      });
      bodyHtml += `</div>`;
    }
    return bodyHtml;
  };
  const renderTableCard = t => {
    let cardHtml = `<div class="node db-table" id="table-${t.id}" data-id="${t.id}" style="text-align:left;padding:18px;cursor:pointer;width:300px;">`;
    cardHtml += `<div class="db-table-header" style="flex-direction:column;align-items:flex-start;gap:2px;"><span style="font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;">${t.name}</span><span style="color:var(--text-dim);font-size:10px;">(${t.tableName})</span></div>`;
    cardHtml += `<div class="db-table-hint">hover or click for columns</div>`;
    cardHtml += `</div>`;
    return cardHtml;
  };
  // Safety net: any table present in the data but not assigned a column in
  // DB_COLUMNS still renders (appended to the last column) instead of vanishing.
  const assignedIds = new Set(DB_COLUMNS.flat());
  const orphaned = API_DATA.dbSchema.tables.filter(t => !assignedIds.has(t.id));
  let html = '<div style="overflow-x: auto;display:flex;justify-content:safe center;min-height: 80vh;width: 100%;"><div id="dbschema-grid" style="position:relative;display:grid;grid-template-columns:repeat(3,300px);column-gap:80px;align-items:start;">';
  DB_COLUMNS.forEach((colIds, colIdx) => {
    html += `<div class="db-col" data-col="${colIdx}" style="display:flex;flex-direction:column;gap:32px;">`;
    colIds.forEach(id => {
    const t = tableById[id];
    if (!t) return;
    html += renderTableCard(t);
    });
    if (colIdx === DB_COLUMNS.length - 1 && orphaned.length) {
      orphaned.forEach(t => { html += renderTableCard(t); });
    }
    html += '</div>';
  });
  html += '<svg class="edges" id="edges-dbschema"></svg></div></div>';
  html += '<div id="dbschema-detail"></div>';
  container.innerHTML = html;
  drawDbSchemaEdges();
  window.addEventListener('resize', drawDbSchemaEdges);

  const detailEl = document.getElementById('dbschema-detail');
  function showDbDetail(id) {
    const t = tableById[id];
    if (!t || !detailEl) return;
    detailEl.innerHTML = dbTableDetailHtml(t);
    detailEl.classList.add('visible');
  }
  function hideDbDetail() {
    if (detailEl) detailEl.classList.remove('visible');
  }

  function recomputePinRelatedExpansion() {
    const pinnedIds = Array.from(document.querySelectorAll('#view-dbschema .node.pinned-expanded')).map(n => n.dataset.id);
    const related = new Set();
    pinnedIds.forEach(pid => {
      API_DATA.dbSchema.relationships.forEach(rel => {
        if (rel.from === pid) related.add(rel.to);
        if (rel.to === pid) related.add(rel.from);
      });
    });
    document.querySelectorAll('#view-dbschema .node').forEach(n => {
      n.classList.toggle('pin-related-expanded', related.has(n.dataset.id) && !pinnedIds.includes(n.dataset.id));
    });
  }

  document.querySelectorAll('#view-dbschema .node').forEach(node => {
    node.addEventListener('mouseenter', () => {
      highlightDbSchema(node.dataset.id);
      showDbDetail(node.dataset.id);
    });
    node.addEventListener('mouseleave', () => {
      clearDbSchemaHighlight();
      if (pinnedDbTableId) { highlightDbSchema(pinnedDbTableId); showDbDetail(pinnedDbTableId); }
      else hideDbDetail();
    });
    node.addEventListener('click', () => {
      const isPinned = node.classList.toggle('pinned-expanded');
      if (isPinned) {
        if (pinnedDbTableId && pinnedDbTableId !== node.dataset.id) {
          const prev = document.getElementById('table-' + pinnedDbTableId);
          if (prev) prev.classList.remove('pinned-expanded');
        }
        pinnedDbTableId = node.dataset.id;
        showDbDetail(pinnedDbTableId);
      } else {
        pinnedDbTableId = null;
        showDbDetail(node.dataset.id);
      }
      recomputePinRelatedExpansion();
    });
  });
}

function drawDbSchemaEdges() {
  const svg = document.getElementById('edges-dbschema');
  if (!svg) return;
  svg.innerHTML = '';
  const svgRect = svg.getBoundingClientRect();
  const colOf = {};
  DB_COLUMNS.forEach((ids, idx) => ids.forEach(id => { colOf[id] = idx; }));
  // Any table not assigned a column in DB_COLUMNS renders in the last column
  // (see renderDbSchema's orphan fallback) — keep routing consistent with that.
  const assignedIds = new Set(DB_COLUMNS.flat());
  API_DATA.dbSchema.tables.forEach(t => {
    if (!assignedIds.has(t.id)) colOf[t.id] = DB_COLUMNS.length - 1;
  });
  const gutterEdgeCounts = {};
  API_DATA.dbSchema.relationships.forEach(rel => {
    const fromEl = document.getElementById('table-' + rel.from);
    const toEl = document.getElementById('table-' + rel.to);
    if (!fromEl || !toEl) return;
    const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
    const colA = colOf[rel.from], colB = colOf[rel.to];
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    let d, lx, ly;
    if (colA === colB) {
      const isLastColumn = colA === DB_COLUMNS.length - 1;
      const xEdge = isLastColumn
        ? Math.min(a.left, b.left) - svgRect.left
        : Math.max(a.right, b.right) - svgRect.left;
      const key = 'same-' + colA;
      gutterEdgeCounts[key] = (gutterEdgeCounts[key] || 0) + 1;
      const idx = gutterEdgeCounts[key] - 1;
      const busX = isLastColumn ? (xEdge - 20 - (idx % 4) * 10) : (xEdge + 20 + (idx % 4) * 10);
      const y1 = a.top + a.height / 2 - svgRect.top;
      const y2 = b.top + b.height / 2 - svgRect.top;
      d = isLastColumn
        ? `M ${a.left - svgRect.left} ${y1} L ${busX} ${y1} L ${busX} ${y2} L ${b.left - svgRect.left} ${y2}`
        : `M ${a.right - svgRect.left} ${y1} L ${busX} ${y1} L ${busX} ${y2} L ${b.right - svgRect.left} ${y2}`;
      lx = isLastColumn ? busX - 24 : busX + 4;
      ly = (y1 + y2) / 2 - 4;
    } else {
      const aIsLeft = colA < colB;
      const leftRect = aIsLeft ? a : b;
      const rightRect = aIsLeft ? b : a;
      const key = 'gutter-' + Math.min(colA, colB);
      gutterEdgeCounts[key] = (gutterEdgeCounts[key] || 0) + 1;
      const idx = gutterEdgeCounts[key] - 1;
      const midX = (leftRect.right + rightRect.left) / 2 - svgRect.left + (idx % 3 - 1) * 12;
      const yLeft = leftRect.top + leftRect.height / 2 - svgRect.top;
      const yRight = rightRect.top + rightRect.height / 2 - svgRect.top;
      d = `M ${leftRect.right - svgRect.left} ${yLeft} L ${midX} ${yLeft} L ${midX} ${yRight} L ${rightRect.left - svgRect.left} ${yRight}`;
      lx = midX;
      ly = (yLeft + yRight) / 2 - 4;
    }
    path.setAttribute('d', d);
    path.setAttribute('class', 'edge');
    path.dataset.from = rel.from;
    path.dataset.to = rel.to;
    svg.appendChild(path);
    const label = rel.cardinality === 'one-to-one' ? '1—1' : '1—*';
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', lx);
    text.setAttribute('y', ly);
    text.setAttribute('fill', 'var(--text-dim)');
    text.setAttribute('font-family', 'var(--mono)');
    text.setAttribute('font-size', '9');
    text.textContent = label;
    svg.appendChild(text);
  });
  if (pinnedDbTableId) highlightDbSchema(pinnedDbTableId);
}

let pinnedDbTableId = null;
function highlightDbSchema(id) {
  const related = new Set([id]);
  API_DATA.dbSchema.relationships.forEach(rel => {
    if (rel.from === id) related.add(rel.to);
    if (rel.to === id) related.add(rel.from);
  });
  document.querySelectorAll('#view-dbschema .node').forEach(n => {
    n.classList.toggle('highlight', related.has(n.dataset.id));
    n.classList.toggle('related-expanded', related.has(n.dataset.id) && n.dataset.id !== id);
  });
  document.querySelectorAll('#view-dbschema path.edge').forEach(p => {
    p.classList.toggle('flow', related.has(p.dataset.from) && related.has(p.dataset.to));
  });
}
function clearDbSchemaHighlight() {
  document.querySelectorAll('#view-dbschema .node').forEach(n => {
    n.classList.remove('highlight');
    n.classList.remove('related-expanded');
  });
  document.querySelectorAll('#view-dbschema path.edge').forEach(p => p.classList.remove('flow'));
}

renderDbSchema();

function renderEndpoints() {
  const container = document.getElementById('view-endpoints');
  const byController = {};
  API_DATA.endpoints.forEach(e => (byController[e.controller] = byController[e.controller] || []).push(e));

  let listHtml = '<div style="display:grid;grid-template-columns:1fr 3fr 1fr;gap:24px;align-items:start;padding-right:4px;">';
  listHtml += '<div id="endpoint-list" style="max-height:80vh;overflow-y:auto;padding:2px 12px 12px 2px;">';
  Object.keys(byController).forEach(controller => {
    listHtml += `<h3 style="font-family:var(--mono);font-size:13px;color:var(--text-dim);">${controller}</h3>`;
    byController[controller].forEach(e => {
      const statusClass = e.status ? ` status-${e.status}` : '';
      const badge = e.status ? `<span class="badge ${e.status}">${e.status}</span>` : '';
      listHtml += `<div class="node${statusClass}" data-id="${e.id}" style="margin-bottom:8px;">${e.method} ${e.path}${badge}</div>`;
    });
  });
  listHtml += '</div>';
  listHtml += '<div id="sequence-panel" style="position:relative;min-height:400px;overflow-x:auto;padding:12px;"><p style="color:var(--text-dim);">Click an endpoint to see its sequence.</p></div>';
  listHtml += `<div id="request-response-panel" style="display:flex;flex-direction:column;gap:16px;">
    <div id="request-body-panel" class="node" style="cursor:default;padding:14px;"><p style="color:var(--text-dim);margin:0;">Click an endpoint to see its request body.</p></div>
    <div id="response-body-panel" class="node" style="cursor:default;padding:14px;"><p style="color:var(--text-dim);margin:0;">Click an endpoint to see its response body.</p></div>
  </div>`;
  listHtml += '</div>';
  container.innerHTML = listHtml;

  document.querySelectorAll('#endpoint-list .node').forEach(node => {
    node.addEventListener('click', () => selectEndpoint(node.dataset.id));
  });
}

function statusClass(code) {
  if (code.startsWith('2')) return 'status-2xx';
  if (code.startsWith('4')) return 'status-4xx';
  return 'status-5xx';
}

function renderRequestPanel(endpoint) {
  if (endpoint.request === undefined) {
    return `<div class="io-panel"><div class="io-header"><span class="io-title">Request — ${endpoint.method} ${endpoint.path}</span></div><div class="io-body" style="color:var(--text-dim);">no example yet</div></div>`;
  }
  return `<div class="io-panel">
    <div class="io-header"><span class="io-title">Request — ${endpoint.method} ${endpoint.path}</span><button class="io-copy-btn" data-copy="request">⧉</button></div>
    <pre class="io-body" data-body="request">${JSON.stringify(endpoint.request, null, 2)}</pre>
  </div>`;
}

function renderResponsePanel(endpoint) {
  const codes = Object.keys(endpoint.response || {});
  if (!codes.length) {
    return `<div class="io-panel"><div class="io-header"><span class="io-title">Response</span></div><div class="io-body" style="color:var(--text-dim);">no example yet</div></div>`;
  }
  const tabs = codes.map((c, i) => `<button class="io-tab ${statusClass(c)}${i === 0 ? ' active' : ''}" data-code="${c}">${c}</button>`).join('');
  const bodies = codes.map((c, i) => `<pre class="io-body" data-body="response" data-code="${c}" style="${i === 0 ? '' : 'display:none;'}">${JSON.stringify(endpoint.response[c], null, 2)}</pre>`).join('');
  return `<div class="io-panel">
    <div class="io-header"><div class="io-tabs">${tabs}</div><button class="io-copy-btn" data-copy="response">⧉</button></div>
    ${bodies}
  </div>`;
}

function wireIoPanel(panelEl) {
  panelEl.querySelectorAll('.io-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      panelEl.querySelectorAll('.io-tab').forEach(t => t.classList.toggle('active', t === tab));
      panelEl.querySelectorAll('[data-body="response"]').forEach(body => {
        body.style.display = body.dataset.code === tab.dataset.code ? '' : 'none';
      });
    });
  });
  const copyBtn = panelEl.querySelector('.io-copy-btn');
  if (copyBtn) {
    copyBtn.addEventListener('click', () => {
      const kind = copyBtn.dataset.copy;
      const visibleBody = Array.from(panelEl.querySelectorAll(`[data-body="${kind}"]`)).find(b => b.style.display !== 'none');
      if (!visibleBody) return;
      navigator.clipboard.writeText(visibleBody.textContent).then(() => {
        copyBtn.classList.add('copied');
        copyBtn.textContent = '✓';
        setTimeout(() => { copyBtn.classList.remove('copied'); copyBtn.textContent = '⧉'; }, 1200);
      });
    });
  }
}

function buildSequenceSvg(sequence, notes) {
  const participants = [];
  sequence.forEach(s => {
    if (!participants.includes(s.from)) participants.push(s.from);
    if (!participants.includes(s.to)) participants.push(s.to);
  });
  const colWidth = 180, rowHeight = 70, topPad = 30, selfLoopWidth = 46, noteWidth = 230, noteCharsPerLine = 34;
  const noteHeightFor = text => 16 + Math.ceil(text.length / noteCharsPerLine) * 13 + 10;
  const hasNotes = (notes || []).length > 0;
  const svgWidth = participants.length * colWidth + selfLoopWidth + (hasNotes ? noteWidth + 30 : 0);
  const maxNoteBottom = Math.max(0, ...(notes || []).map(n => {
    const i = n.stepIndex;
    const yCall = topPad + i * rowHeight + rowHeight * 0.35;
    return yCall - 20 + noteHeightFor(n.text);
  }));
  const svgHeight = Math.max(topPad + sequence.length * rowHeight + 30, maxNoteBottom + 20);
  let html = `<svg width="${svgWidth}" height="${svgHeight}">`;
  participants.forEach((p, i) => {
    const x = i * colWidth + colWidth / 2;
    html += `<text x="${x}" y="18" text-anchor="middle" fill="var(--text)" font-family="var(--mono)" font-size="11">${p}</text>`;
    html += `<line x1="${x}" y1="${topPad}" x2="${x}" y2="${topPad + sequence.length * rowHeight}" stroke="var(--border)" stroke-width="1" />`;
  });
  sequence.forEach((s, i) => {
    const yCall = topPad + i * rowHeight + rowHeight * 0.35;
    const yReturn = topPad + i * rowHeight + rowHeight * 0.7;
    const x1 = participants.indexOf(s.from) * colWidth + colWidth / 2;
    const x2 = participants.indexOf(s.to) * colWidth + colWidth / 2;
    const isSelfCall = x1 === x2;
    const unwired = /UNWIRED/.test(s.label);
    const lineColor = unwired ? 'var(--unwired)' : 'var(--accent)';
    if (isSelfCall) {
      const loopX = x1 + selfLoopWidth;
      html += `<path d="M ${x1} ${yCall} L ${loopX} ${yCall} L ${loopX} ${yReturn} L ${x1} ${yReturn}" fill="none" stroke="${lineColor}" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)" />`;
      html += `<text x="${loopX + 6}" y="${(yCall + yReturn) / 2 + 4}" fill="var(--text-dim)" font-family="var(--mono)" font-size="10">${s.label}</text>`;
    } else {
      html += `<line x1="${x1}" y1="${yCall}" x2="${x2}" y2="${yCall}" stroke="${lineColor}" stroke-width="1.5" stroke-dasharray="6 4" style="animation: flow .5s linear ${i * 0.08}s;" marker-end="url(#arrow)" />`;
      html += `<text x="${(x1 + x2) / 2}" y="${yCall - 6}" text-anchor="middle" fill="var(--text-dim)" font-family="var(--mono)" font-size="10">${s.label}</text>`;
      if (s.returns) {
        html += `<line x1="${x2}" y1="${yReturn}" x2="${x1}" y2="${yReturn}" stroke="var(--text-dim)" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-return)" />`;
        html += `<text x="${(x1 + x2) / 2}" y="${yReturn + 12}" text-anchor="middle" fill="var(--text-dim)" font-family="var(--mono)" font-size="9" font-style="italic">→ ${s.returns}</text>`;
      }
    }
    const note = (notes || []).find(n => n.stepIndex === i);
    if (note) {
      const noteX = Math.max(x1, x2) + colWidth * 0.55 + (isSelfCall ? selfLoopWidth : 0);
      const noteHeight = noteHeightFor(note.text);
      html += `<foreignObject x="${noteX}" y="${yCall - 20}" width="${noteWidth}" height="${noteHeight}">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:var(--mono);font-size:10px;line-height:13px;color:${unwired ? 'var(--danger)' : 'var(--planned)'};background:${unwired ? 'rgba(255,107,107,.1)' : 'rgba(240,180,41,.1)'};border:1px dashed ${unwired ? 'var(--danger)' : 'var(--planned)'};border-radius:4px;padding:4px 6px;box-sizing:border-box;">${note.text}</div>
      </foreignObject>`;
    }
  });
  html += `<defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--accent)" /></marker>
    <marker id="arrow-return" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--text-dim)" /></marker>
  </defs>`;
  html += '</svg>';
  return html;
}

function selectEndpoint(id) {
  document.querySelectorAll('#endpoint-list .node').forEach(n => n.classList.toggle('highlight', n.dataset.id === id));
  const endpoint = API_DATA.endpoints.find(e => e.id === id);
  const panel = document.getElementById('sequence-panel');
  if (!endpoint.sequence.length) {
    panel.innerHTML = `<p style="color:var(--planned);">Planned — not implemented yet. No sequence to show.</p>`;
  } else {
    panel.innerHTML = buildSequenceSvg(endpoint.sequence, endpoint.notes);
  }
  const requestPanel = document.getElementById('request-body-panel');
  const responsePanel = document.getElementById('response-body-panel');
  requestPanel.innerHTML = renderRequestPanel(endpoint);
  responsePanel.innerHTML = renderResponsePanel(endpoint);
  wireIoPanel(requestPanel);
  wireIoPanel(responsePanel);
}

renderEndpoints();

function resolveAnchorName(id) {
  const comp = API_DATA.components.find(c => c.id === id);
  if (comp) return comp.name;
  const ent = API_DATA.entities.find(e => e.id === id);
  if (ent) return ent.name;
  return id;
}

function renderRules() {
  const container = document.getElementById('view-rules');
  let html = '<div style="display:flex;gap:32px;">';
  html += '<div id="rule-list" style="min-width:280px;display:flex;flex-direction:column;gap:8px;">';
  API_DATA.businessRules.forEach(rule => {
    html += `<div class="node" data-id="${rule.id}" style="padding:12px 14px;">${rule.title}</div>`;
  });
  html += '</div>';
  html += '<div id="rule-panel" style="flex:1;"><p style="color:var(--text-dim);">Click a business rule to see its flow diagram.</p></div>';
  html += '</div>';
  container.innerHTML = html;

  document.querySelectorAll('#rule-list .node').forEach(node => {
    node.addEventListener('click', () => selectRule(node.dataset.id));
  });
}

function selectRule(id) {
  document.querySelectorAll('#rule-list .node').forEach(n => n.classList.toggle('highlight', n.dataset.id === id));
  const rule = API_DATA.businessRules.find(r => r.id === id);
  const anchors = rule.anchorsTo.map(resolveAnchorName).join(', ');
  const panel = document.getElementById('rule-panel');
  panel.innerHTML = `
    <h3 style="margin:0 0 6px 0;font-family:var(--mono);font-size:14px;color:var(--accent);">${rule.title}</h3>
    ${renderRuleIllustration(rule.id)}
    <div style="overflow-x:auto;margin:10px 0;">${buildSequenceSvg(rule.flow, rule.flowNotes)}</div>
    <p style="margin:10px 0 4px 0;font-size:11px;color:var(--text-dim);font-family:var(--mono);">${rule.description}</p>
    <p style="margin:0;font-size:10px;color:var(--text-dim);font-family:var(--mono);">anchors: ${anchors}</p>
  `;
}

function renderRuleIllustration(ruleId) {
  if (ruleId === 'fifo-cost-basis') {
    let lots = '';
    for (let i = 0; i < 5; i++) {
      const consumed = i < 2;
      lots += `<rect x="${i * 70}" y="10" width="56" height="36" rx="4" fill="${consumed ? 'var(--border)' : 'var(--panel)'}" stroke="${consumed ? 'var(--text-dim)' : 'var(--accent)'}" stroke-width="1.5" opacity="${consumed ? 0.5 : 1}"/>
        <text x="${i * 70 + 28}" y="32" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="${consumed ? 'var(--text-dim)' : 'var(--text)'}">Lot ${i + 1}</text>`;
    }
    return `<svg width="350" height="70"><text x="0" y="60" font-family="var(--mono)" font-size="9" fill="var(--text-dim)">oldest → consumed first on sell</text>${lots}</svg>`;
  }
  if (ruleId === 'rebalancing-threshold') {
    return `<svg width="220" height="130">
      <path d="M 20 110 A 90 90 0 0 1 200 110" fill="none" stroke="var(--border)" stroke-width="10" />
      <path d="M 95 22 A 90 90 0 0 1 125 22" fill="none" stroke="var(--planned)" stroke-width="10" opacity="0.6" />
      <line x1="110" y1="110" x2="140" y2="35" stroke="var(--accent)" stroke-width="2" />
      <circle cx="110" cy="110" r="4" fill="var(--accent)" />
      <text x="110" y="128" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--text-dim)">target ± 0.5%</text>
    </svg>`;
  }
  if (ruleId === 'dividends-taxed-only') {
    const types = [
      { name: 'Buy', taxed: false },
      { name: 'Sell', taxed: false },
      { name: 'Dividend', taxed: true },
      { name: 'Split', taxed: false }
    ];
    let html = '<svg width="380" height="90">';
    types.forEach((t, i) => {
      const x = i * 95;
      html += `<rect x="${x}" y="5" width="80" height="30" rx="4" fill="var(--panel)" stroke="var(--border)" />
        <text x="${x + 40}" y="24" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--text)">${t.name}</text>
        <line x1="${x + 40}" y1="35" x2="${x + 40}" y2="55" stroke="var(--border)" stroke-width="1" />
        <text x="${x + 40}" y="70" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="${t.taxed ? 'var(--danger)' : 'var(--text-dim)'}">${t.taxed ? '− Tax' : 'no tax'}</text>`;
    });
    html += '</svg>';
    return html;
  }
  return '';
}

renderRules();
</script>
</body>
</html>
